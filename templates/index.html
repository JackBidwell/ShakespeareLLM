<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Shakespeare Engine</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="valance">
    <div class="valance-scallops"></div>
    <h1 class="marquee">The Shakespeare Engine</h1>
    <p class="tagline">Being a Machine's Attempt at the Bard's Art</p>
  </div>

  <main class="stage">
    <section class="book">
      <div class="book-spine"></div>

      <div class="page page-left">
        <h2>Cast the Prompt</h2>

        <label class="field">
          <span>Which player takes the stage?</span>
          <select id="model-select">
            {% for key, info in models.items() %}
            <option value="{{ key }}" {{ '' if info.ready else 'disabled' }}>
              {{ info.label }}{{ '' if info.ready else ' (not ready yet)' }}
            </option>
            {% endfor %}
            <option value="both">Both, side by side</option>
          </select>
        </label>

        <label class="field">
          <span>Thy opening line</span>
          <textarea id="prompt" rows="5" placeholder="Speak, and I shall answer&hellip;">O, what light through</textarea>
        </label>

        <div class="sliders">
          <label class="field slider-field">
            <span>Flourish (temperature) <b id="temp-val">0.8</b></span>
            <input type="range" id="temperature" min="0.1" max="1.5" step="0.05" value="0.8">
          </label>

          <label class="field slider-field">
            <span>Vocabulary breadth (top-k) <b id="topk-val">40</b></span>
            <input type="range" id="top_k" min="5" max="100" step="5" value="40">
          </label>

          <label class="field slider-field">
            <span>Length of speech <b id="len-val">200</b></span>
            <input type="range" id="max_new_tokens" min="20" max="400" step="20" value="200">
          </label>
        </div>

        <button id="generate-btn" class="seal-button">
          <span>Take the Stage</span>
        </button>

        <p id="error" class="error"></p>
      </div>

      <div class="page page-right">
        <h2>The Performance</h2>
        <div id="output" class="output-text">
          <p class="placeholder">Thy verse shall appear upon this page&hellip;</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="curtain-hem"></footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
